<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Sneaker House</title>
  <meta name="description" content="Đăng nhập tài khoản Sneaker House để mua sắm và theo dõi đơn hàng.">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
  <div class="auth">
    <div class="panel">
      <a class="brand" href="index.html" aria-label="Sneaker House — về trang chủ">
        <img class="brand__logo" src="assets/logo-dark.png" alt="" width="1000" height="290">
      </a>
      <a class="mini-hero" href="index.html" aria-label="Sneaker House — về trang chủ">
        <img class="mini-hero__bg" src="assets/slide-1-samba-720.webp" alt="" width="720" height="900" decoding="async">
        <img class="mini-hero__logo" src="assets/logo-light.png" alt="" width="1000" height="290">
        <span class="mini-hero__tag">Sneaker cho từng phong cách.</span>
      </a>

      <main class="panel__main" id="main">
        <div class="form-wrap">
          <noscript><p class="notice notice--error">Trang này cần bật JavaScript để đăng nhập và xem ảnh nổi bật. Vui lòng bật JavaScript rồi tải lại trang.</p></noscript>
          <div data-intro>
            <h1 class="title">Đăng nhập</h1>
            <p class="lead">Chào mừng bạn quay trở lại Sneaker House!</p>
          </div>

          <form class="form" data-form="login" novalidate>
            <div class="err-summary" data-summary role="alert" tabindex="-1" hidden>
              <h2 class="err-summary__title">Vui lòng kiểm tra lại thông tin</h2>
              <ul></ul>
            </div>
            <div class="notice" data-notice hidden></div>

            <div class="field">
              <div class="control control--bare">
                <span class="control__icon" data-icon="mail" aria-hidden="true"></span>
                <label class="sr-only" for="identifier">Email hoặc tên đăng nhập</label>
                <input class="input" id="identifier" name="identifier" type="text" placeholder="example@gmail.com" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="identifier-error" required>
              </div>
              <p class="field__error" id="identifier-error" hidden></p>
            </div>

            <div class="field">
              <div class="control control--pw control--bare">
                <span class="control__icon" data-icon="lock" aria-hidden="true"></span>
                <label class="sr-only" for="password">Mật khẩu</label>
                <input class="input" id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" aria-describedby="password-error" required>
                <button class="pw__toggle" type="button" data-toggle-pw="password"></button>
              </div>
              <p class="field__error" id="password-error" hidden></p>
            </div>

            <div class="row-between">
              <label class="check">
                <input type="checkbox" name="rememberMe">
                <span>Ghi nhớ đăng nhập</span>
              </label>
              <a class="link link--accent link--small" href="forgot-password.html" data-nav>Quên mật khẩu?</a>
            </div>

            <button class="btn" type="submit" data-loading="Đang đăng nhập…">
              <span class="spinner" hidden aria-hidden="true"></span>
              <span data-label>Đăng nhập</span>
            </button>

            <div class="social" data-google>
              <p class="divider"><span>hoặc đăng nhập bằng</span></p>
              <div class="social__btn" data-google-btn></div>
              <div class="social__status notice" data-google-status hidden></div>
            </div>

            <p class="switch">Chưa có tài khoản? <a class="link link--accent" href="register.html" data-nav>Đăng ký ngay</a></p>
          </form>
        </div>
      </main>

      <p class="panel__foot">© 2026 Sneaker House · <a class="link foot-link" href="terms.html">Điều khoản</a> · <a class="link foot-link" href="privacy.html">Chính sách bảo mật</a></p>
    </div>

    <aside class="visual" data-carousel aria-label="Giày nổi bật"></aside>
  </div>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
