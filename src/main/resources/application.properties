
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=sneaker-house-backend
server.port=8080

# ==========================================
# DATABASE - SQL SERVER
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SneakerHouse;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sneaker_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GOOGLE LOGIN
# ==========================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# APPLICATION SETTINGS
# ==========================================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail-from=${MAIL_FROM:no-reply@sneaker-house.local}

# ==========================================
# OTP CONFIGURATION
# ==========================================
app.otp.secret=${OTP_SECRET:}
app.otp.expiration-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.reset-grant-minutes=5

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================================
# LOGGING - DEBUG 403
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web=TRACE
logging.level.org.springframework.security.authorization=TRACE
logging.level.org.springframework.security.web.csrf=TRACE
