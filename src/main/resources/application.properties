spring.application.name=sneaker-house-backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SneakerHouse;encrypt=true;trustServerCertificate=true

spring.datasource.username=sneaker_app
spring.datasource.password=truong123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set to the OAuth Web Client ID from Google Cloud Console.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# SMTP settings: configure real credentials to send password-reset email.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail-from=${MAIL_FROM:no-reply@sneaker-house.local}
# Password reset OTP
app.otp.secret=${OTP_SECRET:}
app.otp.expiration-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.reset-grant-minutes=5
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
logging.level.org.springframework.security.web.access=TRACE
logging.level.org.springframework.security.web.csrf=TRACE
# Avatar upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB